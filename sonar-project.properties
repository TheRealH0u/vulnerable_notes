# SonarCloud Configuration for Vulnerable Notes
# ============================================

# Project identification
sonar.projectKey=TheRealH0u_vulnerable_notes
sonar.organization=therealh0u

# Project metadata
sonar.projectName=Vulnerable Notes
sonar.projectVersion=1.0

# SonarCloud URL
sonar.host.url=https://sonarcloud.io

# Source code configuration
sonar.sources=backend,frontend

# Exclusions - files/folders that should NOT be analyzed
sonar.exclusions=**/node_modules/**, \
                 **/dist/**, \
                 **/build/**, \
                 **/coverage/**, \
                 **/coverage-html/**, \
                 **/__pycache__/**, \
                 **/venv/**, \
                 **/env/**, \
                 **/*.spec.js, \
                 **/*.test.js, \
                 **/test_*.py, \
                 **/tests/**, \
                 **/old_version/**, \
                 **/.github/**, \
                 **/db/**, \
                 **/scripts/**

# Test files location (excluded from main analysis but used for coverage)
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/test_*.py, **/*.spec.js, **/*.test.js

# Coverage reports
# Backend (Python) - pytest-cov generates coverage.xml
sonar.python.coverage.reportPaths=backend/coverage.xml

# Frontend (JavaScript/Vue) - vitest generates lcov report
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Language-specific settings
# Python
sonar.python.version=3.10

# JavaScript/TypeScript
sonar.javascript.node.maxspace=4096

# Code duplication detection
sonar.cpd.exclusions=**/*.spec.js, **/*.test.js, **/test_*.py

# Branch analysis
sonar.branch.name=${GITHUB_REF_NAME}

# Pull Request analysis (configured via GitHub Actions)
# sonar.pullrequest.key=${GITHUB_PR_NUMBER}
# sonar.pullrequest.branch=${GITHUB_HEAD_REF}
# sonar.pullrequest.base=${GITHUB_BASE_REF}

# Encoding
sonar.sourceEncoding=UTF-8

# Additional analysis parameters
sonar.verbose=false
