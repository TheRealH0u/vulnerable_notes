name: CI/CD Pipeline

on:
  push:
    branches: [main, production, new_feature]
  pull_request:
    branches: [main, production, new_feature]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/vulnerable-notes-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/vulnerable-notes-frontend

jobs:
  # ===== BACKEND TESTS =====
  backend-tests:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Run backend tests with coverage
        run: |
          pytest backend/tests \
            --cov=backend/app/application \
            --cov-report=html:backend/coverage-html \
            --cov-report=json:backend/coverage-report.json \
            --cov-report=term-missing \
            -v
      
      - name: Upload backend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report-py${{ matrix.python-version }}
          path: backend/coverage-html/
          retention-days: 30
      
      - name: Upload backend coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-json-py${{ matrix.python-version }}
          path: backend/coverage-report.json
          retention-days: 30

  # ===== FRONTEND TESTS =====
  frontend-tests:
    name: Frontend Tests and Coverage
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      
      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test
      
      - name: Upload frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

  # ===== BACKEND BUILD =====
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-tests
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Create build directory
        run: mkdir -p backend/build
      
      - name: Copy application files
        run: |
          cp -r backend/app backend/build/
          cp backend/requirements.txt backend/build/
          cp backend/Dockerfile backend/build/
          echo "Build completed: $(date)" > backend/build/BUILD_INFO.txt
      
      - name: List build artifacts
        run: |
          echo "=== Backend Build Artifacts ==="
          find backend/build -type f | head -20
          echo "Total size: $(du -sh backend/build | cut -f1)"
      
      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/
          retention-days: 7
          compression-level: 6

  # ===== FRONTEND BUILD =====
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-22.04
    needs: frontend-tests
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Create build manifest
        working-directory: ./frontend/dist
        run: |
          echo "Frontend Build Manifest" > BUILD_MANIFEST.txt
          echo "======================" >> BUILD_MANIFEST.txt
          echo "Build Date: $(date)" >> BUILD_MANIFEST.txt
          echo "Git Commit: ${{ github.sha }}" >> BUILD_MANIFEST.txt
          echo "Git Branch: ${{ github.ref_name }}" >> BUILD_MANIFEST.txt
          echo "" >> BUILD_MANIFEST.txt
          echo "Files:" >> BUILD_MANIFEST.txt
          find . -type f | wc -l | xargs -I {} echo "Total files: {}" >> BUILD_MANIFEST.txt
          du -sh . | cut -f1 | xargs -I {} echo "Total size: {}" >> BUILD_MANIFEST.txt
      
      - name: List build artifacts
        run: |
          echo "=== Frontend Build Artifacts (dist/) ==="
          ls -lah frontend/dist/ | head -15
          echo "Total size: $(du -sh frontend/dist | cut -f1)"
          echo "Total files: $(find frontend/dist -type f | wc -l)"
      
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7
          compression-level: 6

  # ===== DOCKER BUILD & PUSH =====
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: success() && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main')
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Docker Hub Backend Image Info
        run: echo "✅ Backend image pushed to ${{ steps.meta-backend.outputs.tags }}"
      
      - name: Docker Hub Frontend Image Info
        run: echo "✅ Frontend image pushed to ${{ steps.meta-frontend.outputs.tags }}"

  # ===== DEPLOYMENT TO RENDER =====
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: success() && github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy Backend to Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_BACKEND_SERVICE_ID }}?key=${{ secrets.RENDER_BACKEND_API_KEY }}"
      
      - name: Deploy Frontend to Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_FRONTEND_SERVICE_ID }}?key=${{ secrets.RENDER_FRONTEND_API_KEY }}"
      
      - name: Deployment Initiated
        run: |
          echo "✅ Backend deployment initiated on Render"
          echo "✅ Frontend deployment initiated on Render"
          echo "⏱️  Deployments typically complete within 2-5 minutes"
          echo "📊 Monitor progress at https://dashboard.render.com"

  # ===== TEST SUMMARY =====
  test-summary:
    name: Test Summary
    runs-on: ubuntu-22.04
    needs: [backend-tests, frontend-tests, backend-build, frontend-build]
    if: always()
    
    steps:
      - name: Check if tests passed
        run: |
          echo "✅ CI/CD Pipeline Execution Summary"
          echo "===================================="
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Backend Build: ${{ needs.backend-build.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          if [[ "${{ needs.backend-tests.result }}" != "success" || "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi
          echo "✅ All tests and builds passed!"