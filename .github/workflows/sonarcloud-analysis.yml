name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - production
      - new_feature
      - new_feature_2
  pull_request:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  # ===== BACKEND TESTS WITH COVERAGE =====
  backend-coverage:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      - name: Run backend tests with coverage
        run: |
          pytest backend/tests \
            --cov=backend/app/application \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=term-missing \
            -v
      
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 1

  # ===== FRONTEND TESTS WITH COVERAGE =====
  frontend-coverage:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test
      
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 1

  # ===== SONARCLOUD ANALYSIS =====
  sonarcloud-analysis:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of reporting
      
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/
      
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
      
      - name: Verify coverage files
        run: |
          echo "=== Backend Coverage ==="
          ls -la backend/coverage.xml || echo "Backend coverage not found"
          echo ""
          echo "=== Frontend Coverage ==="
          ls -la frontend/coverage/lcov.info || echo "Frontend coverage not found"
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=TheRealH0u_vulnerable_notes
            -Dsonar.organization=therealh0u
      
      - name: SonarCloud Analysis Summary
        run: |
          echo "### 📊 SonarCloud Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** TheRealH0u_vulnerable_notes" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 View detailed results at: https://sonarcloud.io/dashboard?id=TheRealH0u_vulnerable_notes" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload SonarCloud report
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-report
          path: .scannerwork/report-task.txt
          retention-days: 1

  # ===== QUALITY GATE CHECK =====
  quality-gate:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: sonarcloud-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for SonarCloud processing
        run: sleep 10
      
      - name: Check Quality Gate status via API
        run: |
          echo "🔍 Checking SonarCloud Quality Gate status..."
          
          # Get quality gate status from SonarCloud API
          RESPONSE=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=TheRealH0u_vulnerable_notes")
          
          echo "Response: $RESPONSE"
          
          STATUS=$(echo $RESPONSE | grep -o '"status":"[^"]*' | grep -o '[^"]*$')
          
          echo "Quality Gate Status: $STATUS"
          
          if [ "$STATUS" == "OK" ] || [ "$STATUS" == "NONE" ]; then
            echo "✅ Quality Gate PASSED"
            exit 0
          else
            echo "❌ Quality Gate FAILED"
            echo "View details at: https://sonarcloud.io/dashboard?id=TheRealH0u_vulnerable_notes"
            exit 1
          fi
      
      - name: Quality Gate Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Quality Gate PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All quality gate conditions are met!" >> $GITHUB_STEP_SUMMARY
            echo "Code is ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Quality Gate FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Quality gate conditions are not met." >> $GITHUB_STEP_SUMMARY
            echo "Please fix the issues before deploying to production." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔍 View details: https://sonarcloud.io/dashboard?id=TheRealH0u_vulnerable_notes" >> $GITHUB_STEP_SUMMARY
          fi

  # ===== ANALYSIS SUMMARY =====
  analysis-summary:
    name: Analysis Summary
    runs-on: ubuntu-latest
    needs: [sonarcloud-analysis, quality-gate]
    if: always()
    
    steps:
      - name: Check overall status
        run: |
          echo "### 📋 SonarCloud Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SonarCloud Analysis:** ${{ needs.sonarcloud-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Quality Gate:** ${{ needs.quality-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.sonarcloud-analysis.result }}" == "success" && "${{ needs.quality-gate.result }}" == "success" ]]; then
            echo "✅ **All checks passed!** Code quality meets standards." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ **Quality checks failed!** Review the issues before proceeding." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
